# MySQL profile (activate with --spring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crdr2}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:none}
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.h2.console.enabled=false
