# Datasource (defaults to file-based H2; override via DB_URL / DB_USERNAME / DB_PASSWORD / DB_DDL_AUTO for MySQL or custom DB)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/crdr;MODE=MySQL;NON_KEYWORDS=YEAR;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# H2 Web Console (disable in production via H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

# Logging & Error Handling
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
logging.file.name=logs/Crdr.log
logging.logback.rollingpolicy.max-file-size=10240KB
logging.logback.rollingpolicy.file-name-pattern=logs/CrDr-%d{yyyy-MM-dd}-%i.log

spring.profiles.active=@activatedProperties@

# Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.generate_statistics=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.output.ansi.enabled=always

# Tomcat Access Logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.prefix=crdr_access_log
server.tomcat.accesslog.file-date-format=.dd-MM-yyyy
server.tomcat.basedir=tomcat
server.tomcat.accesslog.directory=logs

# Exception loading sessions from persistent storage error resolve
server.servlet.session.persistent=false
