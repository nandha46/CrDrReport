<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div style="max-width: 560px; margin: 16px auto;">
			<div class="crdr-card" style="padding: 28px;">
				<span class="crdr-icon-box crdr-icon-blue"><i
					class="fa-solid fa-user-plus"></i></span>
				<h1 style="font-size: 22px; font-weight: 800; margin: 4px 0 6px;">Create User Account</h1>
				<p class="crdr-card-desc">Provision access for a team member to upload company databases and view financial reports.</p>

				<form th:action="@{/admin/users/new}" th:object="${user}" method="post" style="margin-top: 12px;">
					<div class="row">
						<div class="col-sm-6">
							<div class="form-group">
								<label for="firstName">First Name</label>
								<input type="text" id="firstName" th:field="*{firstName}" class="form-control" required />
							</div>
						</div>
						<div class="col-sm-6">
							<div class="form-group">
								<label for="lastName">Last Name</label>
								<input type="text" id="lastName" th:field="*{lastName}" class="form-control" required />
							</div>
						</div>
					</div>
					<div class="form-group">
						<label for="email">Email Address</label>
						<input type="email" id="email" th:field="*{email}" class="form-control" required />
					</div>
					<div class="form-group">
						<label for="password">Password (minimum 8 characters)</label>
						<input type="password" id="password" th:field="*{password}" class="form-control" required minlength="8" />
					</div>
					<div class="crdr-btn-row" style="margin-top: 16px;">
						<button type="submit" class="crdr-btn crdr-btn-primary"><i
							class="fa-solid fa-user-check"></i> Create User</button>
						<a th:href="@{/admin/users}" class="crdr-btn crdr-btn-outline">View Users</a>
					</div>
				</form>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
