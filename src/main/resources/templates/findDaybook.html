<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div style="max-width: 560px; margin: 16px auto;">
			<div class="crdr-card" style="padding: 28px;">
				<span class="crdr-icon-box crdr-icon-blue"><i
					class="fa-solid fa-book-open"></i></span>
				<h1 style="font-size: 22px; font-weight: 800; margin: 4px 0 6px;">Daybook Date Range</h1>
				<p class="crdr-card-desc">Select start and end dates to view daily debit and credit entries.</p>

				<form th:action="@{/reports/daybook}" th:object="${formdata}" method="post" style="margin-top: 12px;">
					<div class="form-group">
						<label for="startDate">From Date</label>
						<input id="startDate" type="date" class="form-control" th:field="*{startDate}"
							name="startDate" th:min="${fromdate}" th:max="${todate}" required />
					</div>
					<div class="form-group">
						<label for="endDate">To Date</label>
						<input id="endDate" type="date" class="form-control" th:field="*{endDate}"
							name="endDate" th:min="${fromdate}" th:max="${todate}" required />
					</div>
					<div class="crdr-btn-row" style="margin-top: 16px;">
						<button type="submit" class="crdr-btn crdr-btn-primary"><i
							class="fa-solid fa-magnifying-glass"></i> Generate Daybook</button>
						<button type="button" class="crdr-btn crdr-btn-outline" onclick="window.history.back()">Close</button>
					</div>
				</form>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
	<script th:src="@{/script/daybook.js}"></script>
</body>
</html>
