<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div class="crdr-page-header">
			<div>
				<h1><i class="fa-solid fa-trash-can"></i> Delete Company</h1>
				<p class="crdr-page-subtitle">Remove an imported company and its ledger entries from your workspace.</p>
			</div>
			<a th:href="@{/companies/select}" class="crdr-btn crdr-btn-outline"><i
				class="fa-solid fa-building"></i> Select Company</a>
		</div>

		<div class="row">
			<div class="col-md-8" style="margin-bottom: 18px;">
				<div class="crdr-card">
					<h3 class="crdr-card-title">Your Companies</h3>
					<div class="crdr-table-wrap">
						<table class="crdr-table-clean">
							<thead>
								<tr>
									<th>Company ID</th>
									<th>Company Name</th>
									<th>Year</th>
									<th>Address</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="company : ${companies}">
									<td th:text="${company.companyid}">Company ID</td>
									<td th:text="${company.compName}">Company Name</td>
									<td th:text="${company.compYear}">Year</td>
									<td th:text="${company.address1}+' '+${company.city}">Address</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

			<div class="col-md-4">
				<div class="crdr-card">
					<span class="crdr-icon-box crdr-icon-rose"><i
						class="fa-solid fa-triangle-exclamation"></i></span>
					<h3 class="crdr-card-title">Delete by Company ID</h3>
					<form th:action="@{/companies/delete}" method="post">
						<div class="form-group">
							<label for="companyId">Company ID</label>
							<input type="number" id="companyId" class="form-control" name="companyId"
								placeholder="Enter Company ID..." required min="2" max="10000" />
						</div>
						<button type="submit" class="crdr-btn crdr-btn-primary" style="width: 100%; background-color: #e11d48;">
							<i class="fa-solid fa-trash-can"></i> Delete Company
						</button>
					</form>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
