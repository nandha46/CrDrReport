<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
		xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace ="fragments :: head"></head>
<body>
<div th:replace ="fragments :: navbar"></div>
<main class="crdr-main">
    <div class="crdr-page-header">
        <div>
            <h1><i class="fa-solid fa-file-invoice-dollar"></i> Ledger</h1>
            <p class="crdr-page-subtitle">Account-wise transactions and running debit/credit balances.</p>
        </div>
        <div class="crdr-btn-row">
            <a th:href="@{/reports/ledger}" class="crdr-btn crdr-btn-outline"><i class="fa-solid fa-filter"></i> New Filter</a>
            <a th:href="@{/reports}" class="crdr-btn crdr-btn-primary"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </div>
    </div>

    <div class="crdr-card">
    	<div class="crdr-table-wrap">
        <table class="table table-striped table-bordered crdr-table-clean">
            <thead class="thead-dark">
                <tr>
                    <th>Date</th>
                    <th>Narration</th>
                    <th>Debit</th>
                    <th>Credit</th>
                    <th>Balance</th>
                    <th>D/C</th>
                </tr>
            </thead>
            <tbody>
               	<th:block th:each="ledger: ${listLedger}">
               		<tr>
               		 <td></td>
               		 <td><b th:text ="${ledger.accheadName}">AccHead Name</b></td>
               		 <td></td>
               		 <td></td>
               		 <td></td>
               		 <td></td>
               		</tr>
               		<tr>
               		 <td th:text = "${ledger.date}">Date</td>
               		 <td style="color:red">Opening Balance</td>
               		 <td style="color:darkgreen" th:text = "${ledger.openingBal}">Opening Balance Value</td>
               		 <td style="color:darkgreen" th:text= "${ledger.dOrC}">Debot or Credit</td>
               		 <td></td>
               		 <td></td>
               		</tr>
                	<tr th:each ="dailybook : ${ledger.listDailybooks}">
					 <td th:text = "${dailybook.date}"></td>
					 <td th:text = "${dailybook.narration}"></td>
					 <td th:text = "${dailybook.debitAmt}"></td>
					 <td th:text = "${dailybook.creditAmt}"></td>
               		 <td th:text = "${dailybook.balance}"></td>
               		 <td th:text = "${dailybook.debitOrCredit}"></td>
               		</tr>
                <!-- 	<tr>
               		 <td></td>
               		 <td>Total</td>
               		 <td style="color:red" th:text = "${dailybook.debitAmt}">Credit Total</td>
               		 <td style="color:red" th:text = "${dailybook.creditAmt}">Debit Total</td>
               		 <td th:text = "${dailybook.balance}"></td>
               		 <td th:text = "${dailybook.debitOrCredit}"></td>
               		</tr>  -->	
                </th:block>
            </tbody>
        </table>
        </div>
    </div>
</main>
<div th:replace="fragments :: footer"></div>
</body>
</html>
