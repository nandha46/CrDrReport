<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
		xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace ="fragments :: head"></head>
<body>
<div th:replace ="fragments :: navbar"></div>
<main class="crdr-main">
    <div class="crdr-page-header">
        <div>
            <h1><i class="fa-solid fa-landmark"></i> Balance Sheet</h1>
            <p class="crdr-page-subtitle">[[${companyName}]] &middot; [[${reportPeriod}]]</p>
        </div>
        <div class="crdr-btn-row">
            <a th:href="@{/reports/balance-sheet}" class="crdr-btn crdr-btn-outline"><i class="fa-solid fa-filter"></i> New Filter</a>
            <a th:href="@{/reports}" class="crdr-btn crdr-btn-primary"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </div>
    </div>

    <div th:replace="fragments :: report-actions('balance-sheet', 'Balance Sheet')"></div>

    <div class="crdr-card">
    	<div class="crdr-table-wrap">
        <table class="table table-striped table-bordered crdr-table-clean">
            <thead class="thead-dark">
                <tr>
                    <th id="center_align">Particulars</th>
                    <th id="center_align">Liabilities</th>
                    <th id="center_align">Assets</th>
                </tr>
            </thead>
            <tbody>
               		<tr th:each="balSheet: ${listBalSheet}">
               		 <td th:id="${balSheet.level1}" th:text ="${balSheet.particulars}" th:attrappend="isHeader=${balSheet.header}">Acc Head Name</td>
               		 <td id="right_align" style="color:darkgreen" th:text="${balSheet.debit}" th:attrappend="isHeader=${balSheet.header}">Debit</td>
               		 <td id="right_align" style="color:darkgreen" th:text="${balSheet.credit}" th:attrappend="isHeader=${balSheet.header}">Credit</td>
               		</tr>
            </tbody>
        </table>
        </div>
    </div>
</main>
<div th:replace ="fragments :: footer"></div>
</body>
</html>
