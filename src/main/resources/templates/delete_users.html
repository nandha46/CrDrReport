<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div class="crdr-page-header">
			<div>
				<h1><i class="fa-solid fa-user-minus"></i> Delete User</h1>
				<p class="crdr-page-subtitle">Remove a user account and its associated company data.</p>
			</div>
			<a th:href="@{/admin/users}" class="crdr-btn crdr-btn-outline"><i
				class="fa-solid fa-users"></i> All Users</a>
		</div>

		<div class="row">
			<div class="col-md-8" style="margin-bottom: 18px;">
				<div class="crdr-card">
					<h3 class="crdr-card-title">Registered Users</h3>
					<div class="crdr-table-wrap">
						<table class="crdr-table-clean">
							<thead>
								<tr>
									<th>User ID</th>
									<th>E-mail</th>
									<th>First Name</th>
									<th>Last Name</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="user : ${userList}">
									<td th:text="${user.id}">User ID</td>
									<td th:text="${user.email}">E-mail</td>
									<td th:text="${user.firstName}">First Name</td>
									<td th:text="${user.lastName}">Last Name</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

			<div class="col-md-4">
				<div class="crdr-card">
					<span class="crdr-icon-box crdr-icon-rose"><i
						class="fa-solid fa-triangle-exclamation"></i></span>
					<h3 class="crdr-card-title">Delete by User ID</h3>
					<form th:action="@{/admin/users/delete}" method="post">
						<div class="form-group">
							<label for="userId">User ID</label>
							<input type="number" id="userId" class="form-control" name="userId"
								placeholder="Enter User ID..." required min="10" max="10000" />
						</div>
						<button type="submit" class="crdr-btn crdr-btn-primary" style="width: 100%; background-color: #e11d48;">
							<i class="fa-solid fa-trash-can"></i> Delete User
						</button>
					</form>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
