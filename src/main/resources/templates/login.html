<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: index-navbar"></div>

	<main class="crdr-main">
		<div style="max-width: 460px; margin: 24px auto;">
			<div class="crdr-card" style="padding: 28px;">
				<div style="text-align: center; margin-bottom: 16px;">
					<img th:src="@{/images/logo.svg}" alt="CrDr Report Logo"
						style="width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 12px; display: block;" />
					<h1 style="font-size: 24px; font-weight: 800; margin: 0 0 6px;">Sign in to CrDr Report</h1>
					<p class="crdr-page-subtitle" style="margin: 0;">Powered by Extenzia Technology Solutions</p>
				</div>

				<div th:if="${param.error}" class="alert alert-danger" role="alert">
					<i class="fa-solid fa-circle-exclamation"></i> Invalid email or password.
				</div>
				<div th:if="${param.logout}" class="alert alert-success" role="alert">
					<i class="fa-solid fa-circle-check"></i> You have been signed out.
				</div>

				<form th:action="@{/processLogin}" method="post">
					<div class="form-group">
						<label for="login-email">Email address</label>
						<input type="email" id="login-email" name="email" class="form-control"
							placeholder="you@company.com" required autofocus style="height: 44px;" />
					</div>
					<div class="form-group">
						<label for="login-pass">Password</label>
						<input type="password" id="login-pass" name="pass" class="form-control"
							placeholder="Enter your password" required style="height: 44px;" />
					</div>
					<button type="submit" class="crdr-btn crdr-btn-primary" style="width: 100%; margin-top: 8px;">
						<i class="fa-solid fa-right-to-bracket"></i> Sign In
					</button>
				</form>

				<div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--crdr-border); text-align: center; font-size: 13px; color: var(--crdr-muted);">
					Need help? Check the <a th:href="@{/faq}">FAQ</a> or <a th:href="@{/docs}">Documentation</a>.
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
