<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div class="crdr-page-header">
			<div>
				<h1><i class="fa-solid fa-users"></i> Users</h1>
				<p class="crdr-page-subtitle">Registered user accounts across CrDr Report.</p>
			</div>
			<div class="crdr-btn-row">
				<a th:href="@{/admin/users/new}" class="crdr-btn crdr-btn-primary"><i
					class="fa-solid fa-user-plus"></i> Create User</a>
				<a th:href="@{/admin/users/delete}" class="crdr-btn crdr-btn-outline"><i
					class="fa-solid fa-user-minus"></i> Delete User</a>
			</div>
		</div>

		<div class="crdr-card">
			<div class="crdr-table-wrap">
				<table class="crdr-table-clean">
					<thead>
						<tr>
							<th>User ID</th>
							<th>E-mail</th>
							<th>First Name</th>
							<th>Last Name</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="user : ${userList}">
							<td th:text="${user.id}">1</td>
							<td th:text="${user.email}">user@example.com</td>
							<td th:text="${user.firstName}">First</td>
							<td th:text="${user.lastName}">Last</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
