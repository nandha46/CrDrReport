<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
		xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace ="fragments :: head"></head>
<body>
<div th:replace ="fragments :: navbar"></div>
<main class="crdr-main">
    <div class="crdr-page-header">
        <div>
            <h1><i class="fa-solid fa-chart-column"></i> Trading - Profit &amp; Loss</h1>
            <p class="crdr-page-subtitle">[[${companyName}]] &middot; [[${reportPeriod}]]</p>
        </div>
        <div class="crdr-btn-row">
            <a th:href="@{/reports/trading-pl}" class="crdr-btn crdr-btn-outline"><i class="fa-solid fa-filter"></i> New Filter</a>
            <a th:href="@{/reports}" class="crdr-btn crdr-btn-primary"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </div>
    </div>

    <div th:replace="fragments :: report-actions('trading-pl', 'Trading & Profit and Loss')"></div>

    <div class="crdr-card">
    	<div class="crdr-table-wrap">
        <table class="table table-striped table-bordered crdr-table-clean">
            <thead class="thead-dark">
                <tr>
                    <th id="center_align">Particulars</th>
                    <th id="center_align">Debit</th>
                    <th id="center_align">Credit</th>
                </tr>
            </thead>
            <tbody>
               		<tr th:each="tradingPL: ${listTradingPL}">
               		 <td th:id="${tradingPL.level}" th:text ="${tradingPL.particulars}" th:attrappend="isHeader=${tradingPL.header}">Acc Head Name</td>
               		 <td id="right_align" th:text="${tradingPL.debit}" th:attrappend="isHeader=${tradingPL.header}">Debit</td>
               		 <td id="right_align" th:text="${tradingPL.credit}" th:attrappend="isHeader=${tradingPL.header}">Credit</td>
               		</tr>
            </tbody>
        </table>
        </div>
    </div>
</main>
<div th:replace ="fragments :: footer"></div>
</body>
</html>
