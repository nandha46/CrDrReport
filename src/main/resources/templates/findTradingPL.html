<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div class="crdr-page-header">
			<div>
				<h1><i class="fa-solid fa-chart-line"></i> Trading &amp; P&amp;L Filter</h1>
				<p class="crdr-page-subtitle">Configure closing stock, date, and grouping options.</p>
			</div>
		</div>

		<form th:action="@{/reports/trading-pl}" th:object="${tradingPLForm}" method="post">
			<div class="crdr-grid">
				<div class="crdr-card">
					<h3 class="crdr-card-title">Select Account(s)</h3>
					<select class="form-control" th:field="*{accCode}" id="accs"
						name="accCode" size="18" multiple disabled
						style="font-weight: bold; min-height: 360px;">
						<th:block th:each="accHead,accStat : ${accHeadList}">
							<th:block th:switch="${accHead.level1}">
								<option th:case="1" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
								<option th:case="2" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'&nbsp;&nbsp;')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
								<option th:case="3" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'&nbsp;&nbsp;&nbsp;&nbsp;')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
								<option th:case="4" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
								<option th:case="5" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
								<option th:case="6" th:id="${accHead.level1}" th:value="${accHead.accCode}"
									th:text="${#strings.prepend(accHead.accName,'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')}"
									th:attrappend="isHeader=${accHead.accCode == 0?1:0}, count=${accStat.count}">Account</option>
							</th:block>
						</th:block>
					</select>
				</div>

				<div class="crdr-card">
					<h3 class="crdr-card-title">Report Specifications</h3>
					<div class="form-group">
						<label for="exampleFormControlSelect1">Report Order</label>
						<select class="form-control" th:field="*{reportOrder}" id="exampleFormControlSelect1" onchange="show_level(this)">
							<option value="false" selected>All</option>
							<option value="true">Group</option>
						</select>
					</div>
					<div class="form-group">
						<label for="tplEndDate">Trading P&amp;L as on</label>
						<input id="tplEndDate" class="form-control" type="date" th:field="*{endDate}"
							name="endDate" th:min="${fromdate}" th:max="${todate}" />
					</div>
					<div class="form-group">
						<label for="closingStock">Closing Stock</label>
						<input id="closingStock" class="form-control" type="number" th:field="*{closingStock}"
							name="closingStock" th:stock="${closingStock}" />
					</div>
					<div class="form-group">
						<label for="exampleFormControlSelect2">Accounts with Zero Balance</label>
						<select class="form-control" th:field="*{zeroBal}" id="exampleFormControlSelect2">
							<option value="false">Yes</option>
							<option value="true">No</option>
						</select>
					</div>
					<div class="form-group" id="select_level" style="display: none">
						<label for="exampleFormControlSelect3">Select Level</label>
						<select class="form-control" th:field="*{level}" id="exampleFormControlSelect3" onchange="select_acc(this)">
							<option value="6">6</option>
							<option value="5">5</option>
							<option value="4">4</option>
							<option value="3">3</option>
							<option value="2">2</option>
							<option value="1">1</option>
						</select>
					</div>
					<div class="crdr-btn-row" style="margin-top: 12px;">
						<button class="crdr-btn crdr-btn-primary" type="submit"><i
							class="fa-solid fa-magnifying-glass"></i> Generate Trading &amp; P&amp;L</button>
						<button class="crdr-btn crdr-btn-outline" onclick="window.history.back()" type="button">Close</button>
					</div>
				</div>
			</div>
		</form>
	</main>

	<div th:replace="fragments :: footer"></div>
	<script th:src="@{/script/disableselect.js}"></script>
</body>
</html>
