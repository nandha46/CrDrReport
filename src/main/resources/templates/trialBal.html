<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
		xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace ="fragments :: head"></head>
<body>
<div th:replace ="fragments :: navbar"></div>
<main class="crdr-main">
    <div class="crdr-page-header">
        <div>
            <h1><i class="fa-solid fa-scale-balanced"></i> Trial Balance</h1>
            <p class="crdr-page-subtitle">Consolidated debit and credit balances across account heads.</p>
        </div>
        <div class="crdr-btn-row">
            <a th:href="@{/reports/trial-balance}" class="crdr-btn crdr-btn-outline"><i class="fa-solid fa-filter"></i> New Filter</a>
            <a th:href="@{/reports}" class="crdr-btn crdr-btn-primary"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </div>
    </div>

    <div class="crdr-card">
    	<div class="crdr-table-wrap">
        <table class="table table-striped table-bordered crdr-table-clean">
            <thead class="thead-dark">
                <tr>
                    <th id="center_align">Account Name</th>
                    <th id="center_align">Debit</th>
                    <th id="center_align">Credit</th>
                </tr>
            </thead>
            <tbody>
               		<tr th:each="trialview: ${listTrailView}">
               		 <td th:text ="${trialview.accName}" th:id="${trialview.level}" th:attrappend="isHeader=${trialview.header}">Acc Head Name</td>
               		 <td id="right_align" th:text="${trialview.debit}" th:attrappend="isHeader=${trialview.header}">Debit</td>
               		 <td id="right_align" th:text="${trialview.credit}" th:attrappend="isHeader=${trialview.header}">Credit</td>
               		</tr>
            </tbody>
        </table>
        </div>
    </div>
</main>
<div th:replace="fragments :: footer"></div>
</body>
</html>
