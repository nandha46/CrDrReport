<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: head" />
<body>
	<div th:replace="fragments :: navbar"></div>

	<main class="crdr-main">
		<div style="max-width: 560px; margin: 24px auto;">
			<div class="crdr-card" style="padding: 28px; text-align: center;">
				<span class="crdr-icon-box crdr-icon-blue" style="margin: 0 auto;"><i
					class="fa-solid fa-circle-info"></i></span>
				<h2 style="font-size: 20px; font-weight: 700; margin: 10px 0;">[[${message}]]</h2>
				<div class="crdr-btn-row" style="justify-content: center; margin-top: 14px;">
					<button type="button" class="crdr-btn crdr-btn-outline" onclick="window.history.back()"><i
						class="fa-solid fa-arrow-left"></i> Back</button>
					<a th:href="@{/reports}" class="crdr-btn crdr-btn-primary"><i
						class="fa-solid fa-chart-pie"></i> Reports</a>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
